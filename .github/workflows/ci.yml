name: Nexus DSH CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  merge_group:
  workflow_dispatch:
    inputs:
      ccv2_lab:
        description: Also run the experimental CCv2 lab on Linux
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: dsh-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Synthetic identity for test fixtures, scoped to workflow processes.
  GIT_CONFIG_COUNT: '2'
  GIT_CONFIG_KEY_0: user.name
  GIT_CONFIG_VALUE_0: Nexus DSH CI
  GIT_CONFIG_KEY_1: user.email
  GIT_CONFIG_VALUE_1: ci@example.invalid

jobs:
  source:
    name: DSH source contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read pinned Node version
        id: versions
        run: |
          version=$(jq -er '.NodeVersion | select(test("^[0-9]+[.][0-9]+[.][0-9]+$"))' config/versions.json)
          echo "node=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.versions.outputs.node }}
          package-manager-cache: false
      - name: Validate GitHub Actions workflows
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --max-time 90 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$archive"
          printf '%s  %s\n' 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"
      - name: Validate lockfile and npm lifecycle allowlist
        run: node .github/ci/check-lock.cjs
      - name: Check registry advisories
        # Report all advisories and fail on critical findings or audit errors.
        run: npm audit --prefix runtime --omit=dev --audit-level=critical
      - name: JavaScript, shell, routing and CCv2 source contracts
        run: bash .github/ci/check-source.sh
      - name: Verify fail-closed report validation
        run: |
          node .github/ci/test-harness-summary.cjs
          node .github/ci/test-suite-process.cjs
      - name: Parse PowerShell sources
        shell: pwsh
        run: ./.github/ci/check-powershell.ps1

  installed:
    name: DSH install (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows x64 PowerShell 5.1
            runner: windows-2022
            windows_host: windows-powershell
            artifact: Windows-X64-PS51
          - platform: Windows x64 PowerShell 7
            runner: windows-2022
            windows_host: pwsh
            artifact: Windows-X64-PS7
          - platform: Linux x64
            runner: ubuntu-24.04
            artifact: Linux-X64
          - platform: macOS ARM64
            runner: macos-15
            artifact: macOS-ARM64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      npm_config_prefer_offline: 'true'
      npm_config_audit: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set isolated paths
        shell: pwsh
        run: |
          @(
            "DSH_ROOT=$env:RUNNER_TEMP/nexus-dsh"
            "DSH_REPORTS=$env:RUNNER_TEMP/nexus-ci-reports"
            "AIH_USER_BIN=$env:RUNNER_TEMP/nexus-launchers"
            "npm_config_cache=$env:RUNNER_TEMP/nexus-npm-cache"
          ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Cache npm package downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.npm_config_cache }}/_cacache
          key: dsh-npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('config/versions.json', 'runtime/package.json', 'runtime/package-lock.json') }}

      - name: Clean install on Windows
        id: windows_install
        env:
          npm_config_strict_allow_scripts: 'true'
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath $env:DSH_ROOT) { throw 'Expected a clean install root' }
          New-Item -ItemType Directory -Path $env:DSH_REPORTS | Out-Null
          if ($env:RUNNER_ARCH -ne 'X64') { throw 'Expected a Windows x64 runner' }
          & .\setup.ps1 -InstallRoot $env:DSH_ROOT -SkipPathUpdate -SkipDeepSeekLogin -SkipOpenAiLogin -SkipLocalChecks *>&1 |
            Tee-Object -FilePath "$env:DSH_REPORTS/install.log"
      - name: Clean install on Linux or macOS
        id: posix_install
        env:
          npm_config_strict_allow_scripts: 'true'
        if: runner.os != 'Windows'
        shell: bash
        run: |
          test ! -e "$DSH_ROOT"
          mkdir "$DSH_REPORTS"
          case "$(uname -s):$(uname -m)" in
            Linux:x86_64) ;;
            Darwin:arm64)
              if ! command -v xz; then
                HOMEBREW_NO_AUTO_UPDATE=1 brew install xz
              fi
              ;;
            *) echo "Unsupported runner architecture"; exit 1 ;;
          esac
          ./setup.sh --install-root "$DSH_ROOT" --user-bin "$AIH_USER_BIN" \
            --skip-deepseek-login --skip-openai-login --skip-path-check --skip-local-checks \
            2>&1 | tee "$DSH_REPORTS/install.log"

      - name: Verify pinned runtime and offline Windows doctor
        if: runner.os == 'Windows'
        shell: powershell
        # Doctor checks credential presence even in offline mode.
        env:
          DEEPSEEK_API_KEY: ci-offline-placeholder
        run: |
          $versions = Get-Content config/versions.json -Raw | ConvertFrom-Json
          $reported = & "$env:DSH_ROOT/runtime/node/node.exe" --version
          if ($LASTEXITCODE -ne 0 -or $reported -ne "v$($versions.NodeVersion)") { throw "Unexpected Node version: $reported" }
          & "$env:DSH_ROOT/bin/aih-doctor.cmd" -Offline
          exit $LASTEXITCODE
      - name: Ensure Linux browser opener is available
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if ! command -v xdg-open; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends xdg-utils
          fi

      - name: Verify pinned runtimes and offline POSIX doctor
        if: runner.os != 'Windows'
        shell: bash
        env:
          DEEPSEEK_API_KEY: ci-offline-placeholder
        run: |
          node_version=$(jq -er .NodeVersion config/versions.json)
          pwsh_version=$(jq -er .PowerShellVersion config/versions.json)
          test "$("$DSH_ROOT/runtime/node/bin/node" --version)" = "v$node_version"
          test "$("$DSH_ROOT/runtime/pwsh/pwsh" --version)" = "PowerShell $pwsh_version"
          export PATH="$AIH_USER_BIN:$DSH_ROOT/runtime/node/bin:$DSH_ROOT/runtime/pwsh:$PATH"
          # Use the ripgrep binary from the lockfile when the runner has no system rg.
          if ! command -v rg; then
            rg_path=$(cd "$DSH_ROOT/app" && node --input-type=module -e 'import { rgPath } from "@vscode/ripgrep"; console.log(rgPath)')
            test -x "$rg_path"
            rg_bin=$(dirname "$rg_path")
            export PATH="$rg_bin:$PATH"
            printf '%s\n' "$rg_bin" >> "$GITHUB_PATH"
          fi
          cd "$RUNNER_TEMP"
          "$AIH_USER_BIN/aih-doctor" -Offline

      - name: Installed production harness on Windows PowerShell 5.1
        if: matrix.windows_host == 'windows-powershell' && !cancelled() && steps.windows_install.outcome == 'success'
        shell: powershell
        run: |
          $env:PATH = "$env:DSH_ROOT/runtime/node;$env:PATH"
          $env:TEMP = $env:RUNNER_TEMP
          $env:TMP = $env:RUNNER_TEMP
          Set-Location $env:RUNNER_TEMP
          & "$env:DSH_ROOT/bin/aih-test.cmd" -Lane production -ContinueOnFailure -ReportPath "$env:DSH_REPORTS/production.json"
          exit $LASTEXITCODE
      - name: Installed production harness on pinned POSIX PowerShell
        if: runner.os != 'Windows' && !cancelled() && steps.posix_install.outcome == 'success'
        shell: bash
        run: |
          export PATH="$AIH_USER_BIN:$DSH_ROOT/runtime/node/bin:$DSH_ROOT/runtime/pwsh:$PATH"
          export AIH_TEST_PWSH="$DSH_ROOT/runtime/pwsh/pwsh"
          # Keep Git and DSH fixtures outside the checkout and avoid macOS temp aliases.
          TMPDIR=$(cd "$RUNNER_TEMP" && pwd -P)
          export TMPDIR
          cd "$TMPDIR"
          "$AIH_USER_BIN/aih-test" -Lane production -ContinueOnFailure -ReportPath "$DSH_REPORTS/production.json"

      - name: Installed production harness on Windows PowerShell 7
        if: matrix.windows_host == 'pwsh' && !cancelled() && steps.windows_install.outcome == 'success'
        shell: pwsh
        run: |
          $env:PATH = "$env:DSH_ROOT/runtime/node;$env:PATH"
          $env:TEMP = $env:RUNNER_TEMP
          $env:TMP = $env:RUNNER_TEMP
          $env:AIH_TEST_PWSH = (Get-Command pwsh).Source
          Write-Host "Runner PowerShell version $($PSVersionTable.PSVersion)"
          Set-Location $env:RUNNER_TEMP
          $harness = "$env:DSH_ROOT/scripts/Test-Harness.ps1"
          & $env:AIH_TEST_PWSH -NoProfile -File $harness -InstallRoot $env:DSH_ROOT -PowerShellExecutable $env:AIH_TEST_PWSH -Lane production -ContinueOnFailure -ReportPath "$env:DSH_REPORTS/production.json"
          exit $LASTEXITCODE

      - name: Run opt-in CCv2 laboratory from source
        if: runner.os == 'Linux' && !cancelled() && steps.posix_install.outcome == 'success' && inputs.ccv2_lab
        shell: bash
        run: |
          TMPDIR=$(cd "$RUNNER_TEMP" && pwd -P)
          export TMPDIR
          ln -s "$DSH_ROOT/runtime/node" runtime/node
          ln -s "$DSH_ROOT/runtime/pwsh" runtime/pwsh
          ln -s "$DSH_ROOT/app" app
          export PATH="$DSH_ROOT/runtime/node/bin:$DSH_ROOT/runtime/pwsh:$PATH"
          "$DSH_ROOT/runtime/pwsh/pwsh" -NoProfile -File scripts/Test-Harness.ps1 -Lane ccv2-lab \
            -ContinueOnFailure -ReportPath "$DSH_REPORTS/ccv2-lab.json"

      - name: Validate and summarize production report
        if: '!cancelled()'
        shell: pwsh
        run: ./.github/ci/harness-summary.ps1 -ReportPath "$env:DSH_REPORTS/production.json"
      - name: Validate and summarize CCv2 lab report
        if: runner.os == 'Linux' && !cancelled() && inputs.ccv2_lab
        shell: pwsh
        run: ./.github/ci/harness-summary.ps1 -Lane ccv2-lab -ReportPath "$env:DSH_REPORTS/ccv2-lab.json"
      - name: Upload install and test diagnostics
        if: '!cancelled()'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dsh-ci-${{ matrix.artifact }}
          path: ${{ env.DSH_REPORTS }}
          retention-days: 7
          if-no-files-found: warn

  gate:
    name: Nexus DSH required
    needs: [source, installed]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require successful source and platform jobs
        shell: bash
        env:
          SOURCE: ${{ needs.source.result }}
          INSTALLED: ${{ needs.installed.result }}
        run: |
          printf 'Source contracts: %s\nInstall matrix: %s\n' "$SOURCE" "$INSTALLED" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$SOURCE" = success && test "$INSTALLED" = success
