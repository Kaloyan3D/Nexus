name: Temporary epistemic hardening runner

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - feature/memory-layer

permissions:
  contents: write

jobs:
  harden:
    if: github.event.pull_request.head.ref == 'fix/epistemic-production-hardening'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out hardening head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Detect pending patch
        id: patch
        shell: pwsh
        run: |
          if (Test-Path 'scripts/patch-epistemic-production-hardening.mjs') {
            'needed=true' >> $env:GITHUB_OUTPUT
          } else {
            'needed=false' >> $env:GITHUB_OUTPUT
          }

      - name: Apply bounded production hardening
        if: steps.patch.outputs.needed == 'true'
        shell: pwsh
        run: node scripts/patch-epistemic-production-hardening.mjs

      - name: Check controller syntax
        if: steps.patch.outputs.needed == 'true'
        shell: pwsh
        run: node --check config/AihController.cjs

      - name: Run focused classifier and usage regressions
        if: steps.patch.outputs.needed == 'true'
        shell: pwsh
        run: node tests/EpistemicProductionHardening.Tests.cjs

      - name: Run telemetry regressions
        if: steps.patch.outputs.needed == 'true'
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests/EngineeringTelemetry.Tests.ps1 -InstallRoot $PWD.Path

      - name: Run existing controller regressions
        if: steps.patch.outputs.needed == 'true'
        shell: pwsh
        run: node tests/AihController.Tests.cjs

      - name: Run existing epistemic policy regressions
        if: steps.patch.outputs.needed == 'true'
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests/EpistemicPolicy.Tests.ps1 -InstallRoot $PWD.Path

      - name: Run full durable harness
        if: steps.patch.outputs.needed == 'true'
        shell: powershell
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'epistemic-production-hardening.report.json'
          powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/Test-Harness.ps1 -InstallRoot $PWD.Path -ReportPath $report
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content -Raw $report

      - name: Commit verified hardening to PR head
        if: steps.patch.outputs.needed == 'true'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f scripts/patch-epistemic-production-hardening.mjs .github/workflows/epistemic-production-hardening.yml
          git add config/AihController.cjs scripts/Engineering/Telemetry.ps1 scripts/Test-Harness.ps1 tests/EpistemicProductionHardening.Tests.cjs tests/EngineeringTelemetry.Tests.ps1
          git diff --cached --check
          git commit -m "fix(engineering): harden epistemic production routing"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
