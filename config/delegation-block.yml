# ── delegation and workflows (DSH 0.2.x) ───────────────────────────────────
# Single source for the Nexus delegation surface; scripts/Build-NexusHomePatch.cjs
# inserts this group into the aih-engineering and aih-deepseek planes (the codex
# row is dropped structurally for aih-deepseek; aih-muse has no delegation group).
#
# Differences from DSH 0.1.x (the upstream tool config changed):
#   - per-worker `persona`, `backgroundMode` and `enableRunInBackground` no
#     longer exist; a worker inherits the parent plane's persona. A dedicated
#     worker persona would need a worker agent preset (follow-up).
#   - `tool-subagent-control/list-agents` was folded into tool-subagent-control.
#   - `workflow-worker-thread` was replaced by `workflow-ptc`.

- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: deepseek-normal-worker
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: deepseek_normal
        maxDepth: 1
        agentOptions:
          provider: flash-high-direct
          model: deepseek-v4-flash
          reasoningEffort: high

    - id: deepseek-deep-worker
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: deepseek_deep
        maxDepth: 1
        agentOptions:
          provider: flash-max-direct
          model: deepseek-v4-flash
          reasoningEffort: max

    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        maxDepth: provider-managed

    - id: workflow-ptc
      name: '@deepseek-ai/dsh-workflow-ptc'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'
