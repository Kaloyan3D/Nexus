# ── delegation and workflows ────────────────────────────────────────────────

- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: deepseek-normal-worker
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: deepseek_normal
        backgroundMode: continuable
        maxDepth: 1
        agentOptions:
          provider: flash-high-direct
          model: deepseek-v4-flash
          reasoningEffort: high
        persona: >-
          You are the implementation agent. Complete the supplied bounded task. Use repository-local instructions, inspect relevant context before modifying, respect task scope, and use targeted verification. The deterministic controller decides completion. If blocked, return one structured escalation with a stable failure signature and concrete evidence.

    - id: deepseek-deep-worker
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: deepseek_deep
        backgroundMode: continuable
        maxDepth: 1
        agentOptions:
          provider: flash-max-direct
          model: deepseek-v4-flash
          reasoningEffort: max
        persona: >-
          You are the implementation agent with an expanded reasoning budget. Resolve the supplied bounded failure or task. Use only the supplied structured state and repository context, run targeted verification, and return evidence. The deterministic controller decides completion. If unresolved, return one structured escalation scoped to the remaining question.

    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        enableRunInBackground: false
        maxDepth: provider-managed

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'
