- id: engineering-base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: '../aih-engineering/agent.cordis.yml'
    patches:
      - id: persona
        config:
          text: !!js process.env.AIH_PERSONA_DEEPSEEK ?? 'You are the DeepSeek implementation agent. Complete the bounded task with relevant repository context and targeted verification. The deterministic controller owns state, routing, retries, budgets, escalation, and completion. Codex is unavailable in this preset.'
      - id: tool-subagent-codex
        disabled: true

- id: aih-deepseek-isolation
  name: './DeepSeek-Isolation.cjs'
