agent-default-model:
  provider: flash-max-direct
  model: deepseek-v4-flash
  reasoningEffort: max

agent-presets:
  default: aih-engineering

engineering-profile: deepseek-codex

llm-pi-ai:
  providers:
    sol-local:
      displayName: GPT-5.6 Sol (local OAuth)
      apiKeyEnv: AIH_LOCAL_OAUTH_KEY
      api: openai-responses
      baseURL: http://127.0.0.1:10531/v1
      reasoning: medium
      models:
        - id: gpt-5.6-sol
          name: GPT-5.6 Sol
          reasoningEfforts:
            off:
            low: low
            medium: medium
            high: high
            xhigh: xhigh
            max: max
    deepseek-pro-direct:
      displayName: DeepSeek V4 Pro MAX (direct)
      apiKeyEnv: DEEPSEEK_API_KEY
      api: openai-completions
      baseURL: https://api.deepseek.com
      reasoning: max
      compat:
        thinkingFormat: deepseek
      models:
        - id: deepseek-v4-pro
          name: DeepSeek V4 Pro
          reasoningEfforts:
            off:
            high: high
            max: max
    flash-max-direct:
      displayName: DeepSeek V4 Flash MAX (direct)
      apiKeyEnv: DEEPSEEK_API_KEY
      api: openai-completions
      baseURL: https://api.deepseek.com
      reasoning: max
      compat:
        thinkingFormat: deepseek
      models:
        - id: deepseek-v4-flash
          name: DeepSeek V4 Flash
          reasoningEfforts:
            off:
            high: high
            max: max
    flash-high-direct:
      displayName: DeepSeek V4 Flash High (direct)
      apiKeyEnv: DEEPSEEK_API_KEY
      api: openai-completions
      baseURL: https://api.deepseek.com
      reasoning: high
      compat:
        thinkingFormat: deepseek
      models:
        - id: deepseek-v4-flash
          name: DeepSeek V4 Flash
          reasoningEfforts:
            off:
            high: high
            max: max
    deepseek-vision-direct:
      displayName: DeepSeek V4 Flash Vision (direct)
      apiKeyEnv: DEEPSEEK_API_KEY
      api: openai-completions
      baseURL: https://api.deepseek.com
      reasoning: high
      compat:
        thinkingFormat: deepseek
      models:
        - id: deepseek-v4-flash-vision-exp
          name: DeepSeek V4 Flash Vision (Exp)
          reasoningEfforts:
            off:
            high: high
    zai-direct:
      displayName: Z.ai GLM (direct)
      apiKeyEnv: ZAI_API_KEY
      api: openai-completions
      baseURL: https://api.z.ai/api/paas/v4
      reasoning: high
      models:
        - id: glm-5.3-flash
          name: GLM-5.3-Flash
          reasoningEfforts:
            off:
            high: high
        - id: glm-5.3
          name: GLM-5.3
          reasoningEfforts:
            off:
            high: high
            max: max
ui-theme:
  preference: dark
