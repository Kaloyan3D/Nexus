agent-default-model:
  provider: flash-max-direct
  model: deepseek-v4-flash
  reasoningEffort: max

agent-presets:
  default: aih-engineering

engineering-profile: deepseek-codex

llm-pi-ai:
  providers:
    sol-local:
      displayName: GPT-5.6 Sol (local OAuth)
      apiKeyEnv: AIH_LOCAL_OAUTH_KEY
      api: openai-responses
      baseURL: http://127.0.0.1:10531/v1
      reasoning: medium
      models:
        - id: gpt-5.6-sol
          name: GPT-5.6 Sol
          reasoningEfforts:
            off:
            low: low
            medium: medium
            high: high
            xhigh: xhigh
            max: max
    deepseek-pro-direct:
      displayName: DeepSeek V4 Pro MAX (direct)
      apiKeyEnv: DEEPSEEK_API_KEY
      api: openai-completions
      baseURL: https://api.deepseek.com
      reasoning: max
      compat:
        thinkingFormat: deepseek
      models:
        - id: deepseek-v4-pro
          name: DeepSeek V4 Pro
          reasoningEfforts:
            off:
            high: high
            max: max
    flash-max-direct:
      displayName: DeepSeek V4 Flash MAX (direct)
      apiKeyEnv: DEEPSEEK_API_KEY
      api: openai-completions
      baseURL: https://api.deepseek.com
      reasoning: max
      compat:
        thinkingFormat: deepseek
      models:
        - id: deepseek-v4-flash
          name: DeepSeek V4 Flash
          reasoningEfforts:
            off:
            high: high
            max: max
    flash-high-direct:
      displayName: DeepSeek V4 Flash High (direct)
      apiKeyEnv: DEEPSEEK_API_KEY
      api: openai-completions
      baseURL: https://api.deepseek.com
      reasoning: high
      compat:
        thinkingFormat: deepseek
      models:
        - id: deepseek-v4-flash
          name: DeepSeek V4 Flash
          reasoningEfforts:
            off:
            high: high
            max: max
    deepseek-vision-direct:
      displayName: DeepSeek V4 Flash Vision (direct)
      apiKeyEnv: DEEPSEEK_API_KEY
      api: openai-completions
      baseURL: https://api.deepseek.com
      reasoning: high
      compat:
        thinkingFormat: deepseek
      models:
        - id: deepseek-v4-flash-vision-exp
          name: DeepSeek V4 Flash Vision (Exp)
          reasoningEfforts:
            off:
            high: high
    zai-direct:
      displayName: Z.ai GLM (direct)
      apiKeyEnv: ZAI_API_KEY
      api: openai-completions
      baseURL: https://api.z.ai/api/paas/v4
      reasoning: high
      models:
        - id: glm-5.3-flash
          name: GLM-5.3-Flash
          reasoningEfforts:
            off:
            high: high
        - id: glm-5.3
          name: GLM-5.3
          reasoningEfforts:
            off:
            high: high
            max: max
    meta-model-api:
      displayName: Meta Model API (Muse Spark, direct)
      apiKeyEnv: MODEL_API_KEY
      api: openai-completions
      baseURL: https://api.meta.ai/v1
      reasoning: xhigh
      compat:
        # Meta Model API wire contract (official Meta Model API cookbook,
        # verified Phase M2): OpenAI-compatible chat completions; reasoning via
        # reasoning_effort; usage in streaming via stream_options; developer
        # role preferred over system; canonical output-cap field is
        # max_completion_tokens. Muse Spark natively accepts reasoning_effort
        # none < minimal < low < medium < high, PLUS the accepted alias xhigh
        # (same strength as high). Nexus levels map in reasoningEfforts below;
        # an unmapped Nexus level is never sent (fail closed at the boundary).
        thinkingFormat: openai
        supportsReasoningEffort: true
        supportsUsageInStreaming: true
        supportsDeveloperRole: true
        maxTokensField: max_completion_tokens
      models:
        - id: muse-spark-1.3
          name: Muse Spark 1.3
          contextWindow: 1048576
          maxTokens: 32768
          reasoningEfforts:
            off:
            high: high
            xhigh: xhigh
            max: high
ui-theme:
  preference: dark
