agent-default-model:
  provider: flash-max-direct
  model: deepseek-v4-flash
  reasoningEffort: max

agent-presets:
  default: aih-engineering

engineering-profile: deepseek-codex

llm-pi-ai:
  providers:
    sol-local:
      displayName: GPT-5.6 Sol (local OAuth)
      apiKeyEnv: AIH_LOCAL_OAUTH_KEY
      api: openai-responses
      baseURL: http://127.0.0.1:10531/v1
      reasoning: medium
      models:
        - id: gpt-5.6-sol
          name: GPT-5.6 Sol
          reasoningEfforts:
            off:
            low: low
            medium: medium
            high: high
            xhigh: xhigh
            max: max
    deepseek-pro-direct:
      displayName: DeepSeek V4 Pro MAX (direct)
      apiKeyEnv: DEEPSEEK_API_KEY
      api: openai-completions
      baseURL: https://api.deepseek.com
      reasoning: max
      compat:
        thinkingFormat: deepseek
      models:
        - id: deepseek-v4-pro
          name: DeepSeek V4 Pro
          reasoningEfforts:
            off:
            high: high
            max: max
    flash-max-direct:
      displayName: DeepSeek V4 Flash MAX (direct)
      apiKeyEnv: DEEPSEEK_API_KEY
      api: openai-completions
      baseURL: https://api.deepseek.com
      reasoning: max
      compat:
        thinkingFormat: deepseek
      models:
        - id: deepseek-v4-flash
          name: DeepSeek V4 Flash
          reasoningEfforts:
            off:
            high: high
            max: max
    flash-high-direct:
      displayName: DeepSeek V4 Flash High (direct)
      apiKeyEnv: DEEPSEEK_API_KEY
      api: openai-completions
      baseURL: https://api.deepseek.com
      reasoning: high
      compat:
        thinkingFormat: deepseek
      models:
        - id: deepseek-v4-flash
          name: DeepSeek V4 Flash
          reasoningEfforts:
            off:
            high: high
            max: max
    deepseek-vision-direct:
      displayName: DeepSeek V4 Flash Vision (direct)
      apiKeyEnv: DEEPSEEK_API_KEY
      api: openai-completions
      baseURL: https://api.deepseek.com
      reasoning: high
      compat:
        thinkingFormat: deepseek
      models:
        - id: deepseek-v4-flash-vision-exp
          name: DeepSeek V4 Flash Vision (Exp)
          reasoningEfforts:
            off:
            high: high
    zai-direct:
      displayName: Z.ai GLM (direct)
      apiKeyEnv: ZAI_API_KEY
      api: openai-completions
      baseURL: https://api.z.ai/api/paas/v4
      reasoning: high
      models:
        - id: glm-5.3-flash
          name: GLM-5.3-Flash
          reasoningEfforts:
            off:
            high: high
        - id: glm-5.3
          name: GLM-5.3
          reasoningEfforts:
            off:
            high: high
            max: max
    meta-model-api:
      displayName: Meta Model API (Muse Spark 1.3 Contributor, direct)
      apiKeyEnv: MODEL_API_KEY
      api: openai-completions
      baseURL: https://api.meta.ai/v1
      reasoning: xhigh
      compat:
        # Meta Model API wire contract (official dev.meta.ai docs, re-verified
        # Phase M2.1): OpenAI-compatible chat completions; reasoning via
        # reasoning_effort; usage in streaming via stream_options; developer
        # role preferred over system; canonical output-cap field is
        # max_completion_tokens. Official reasoning levels are
        # minimal < low < medium < high < xhigh, plus max on Standard-tier
        # muse-spark-1.3 ONLY (the Contributor variant does not offer it).
        # There is NO explicit no-reasoning value: reasoning_effort "none"
        # returns HTTP 400 ("Muse Spark always reasons"), and OMITTING the
        # parameter makes the model reason at a model-determined level, so
        # omission is not "off". The Contributor model therefore declares no
        # off and no max level; an unmapped Nexus level is never sent (fail
        # closed at the boundary).
        thinkingFormat: openai
        supportsReasoningEffort: true
        supportsUsageInStreaming: true
        supportsDeveloperRole: true
        maxTokensField: max_completion_tokens
      models:
        - id: muse-spark-1.3-contributor
          name: Muse Spark 1.3 Contributor
          input: [text, image]
          # Official direct-API limits (dev.meta.ai/docs/models): context
          # 1,048,576 tokens (input and output share the budget), output
          # 131,072 tokens. maxTokens is the vendor-verified output ceiling,
          # never a Nexus safety cap; per-request operational caps are chosen
          # at the call sites that impose them.
          contextWindow: 1048576
          maxTokens: 131072
          reasoningEfforts:
            minimal: minimal
            low: low
            medium: medium
            high: high
            xhigh: xhigh
    opencode-go:
      displayName: OpenCode Go (Muse Spark 1.3 Contributor over Responses)
      apiKeyEnv: OPENCODE_API_KEY
      api: openai-responses
      baseURL: https://opencode.ai/zen/go/v1
      reasoning: xhigh
      compat:
        # OpenCode Go Responses transport (TASK-0006, verified 2026-09-23
        # against the live authenticated endpoint
        # https://opencode.ai/zen/go/v1/models and the official Go docs):
        # the Go directory serves remote model id muse-spark-1.3-contributor
        # at the Responses endpoint https://opencode.ai/zen/go/v1/responses
        # (the regular Zen route https://opencode.ai/zen/v1/responses serves
        # muse-spark-1.3 instead and MUST NOT be used for this profile).
        # reasoning_effort is a transport-level Responses
        # field (proven in the pinned pi-ai openai-responses implementation:
        # params.reasoning.effort honours the route thinkingLevelMap). Levels
        # minimal..xhigh mirror the Contributor contract; off/max stay absent
        # exactly as on the Meta Direct route (fail closed at the boundary).
        # The Contributor data-use terms travel with the model, not the wire.
        # LIVE-VERIFIED 2026-09-23: the Go endpoint additionally requires a
        # stable x-opencode-session header per conversation (routing/prompt
        # caching; without it HTTP 400 MissingSessionID) plus a workspace
        # privacy opt-in for training-on-data paid endpoints (else HTTP 400
        # privacy-gate). Auth failures surface as HTTP 401 AuthError and
        # unknown models as HTTP 400 "Model is unavailable" — all distinct
        # from Meta Direct errors, never falling back to Meta.
        # SUBSTRATE-PROVEN: openai-responses owns its native output field
        # (params.max_output_tokens, floor 16) — no maxTokensField is
        # configured here. That key exists only on openai-completions and a
        # route-level declaration fails resolution naming what the protocol
        # offers (TASK-0006 blocker: one invalid managed field made BOTH
        # routes unavailable). supportsDeveloperRole is the single Responses
        # compat switch this route sets (offered by OpenAIResponsesCompat).
        supportsDeveloperRole: true
      models:
        - id: muse-spark-1.3-contributor
          name: Muse Spark 1.3 Contributor (OpenCode Go)
          input: [text, image]
          # Capacity mirrors the Meta-verified Contributor window until the
          # OpenCode transport publishes its own per-model ceilings; the live
          # parity battery (TASK-0006) confirms/adjusts these values.
          contextWindow: 1048576
          maxTokens: 131072
          reasoningEfforts:
            minimal: minimal
            low: low
            medium: medium
            high: high
            xhigh: xhigh
ui-theme:
  preference: dark
