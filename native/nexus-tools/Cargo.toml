[package]
name = "nexus-tools"
version = "0.1.0"
edition = "2021"
description = "Nexus Native Core A3.1 secure read-only workspace tools (fs.list, fs.read, fs.search) bound to Kernel-sealed grants"
license = "MIT"

[dependencies]
nexus-contracts = { workspace = true }
nexus-kernel = { workspace = true }
nexus-store = { workspace = true }
libc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }

[features]
# Test-only deterministic SIGKILL points for crash-recovery tests.
crash-injection = []

[dev-dependencies]
tempfile = { workspace = true }
rusqlite = { workspace = true }
