[workspace]
members = ["nexus-contracts", "nexus-store", "nexus-kernel", "nexus-daemon", "nexus-model", "nexus-client", "nexus-cli", "nexus-transcript"]
resolver = "2"

[workspace.dependencies]
nexus-contracts = { path = "nexus-contracts" }
nexus-store = { path = "nexus-store" }
nexus-kernel = { path = "nexus-kernel" }
nexus-model = { path = "nexus-model" }
nexus-client = { path = "nexus-client" }
nexus-transcript = { path = "nexus-transcript" }
libc = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
fs2 = "0.4"
